[project]
name = "verbasizer"
version = "0.1.0"
description = "Herramienta de cut-up: reconstrucción del Verbasizer de Bowie y de los métodos de Burroughs y Gysin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["cut-up", "burroughs", "gysin", "bowie", "verbasizer", "escritura generativa"]

# El motor no tiene dependencias a propósito: es Python puro y determinístico.
dependencies = []

[project.optional-dependencies]
# Backend web y etiquetado gramatical.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "spacy>=3.7,<4",
]

# Modelos de idioma. Se instalan aparte porque no están en PyPI.
#   python -m spacy download es_core_news_sm
#   python -m spacy download en_core_web_sm

dev = [
    "pytest>=8",
    "httpx>=0.27",   # lo necesita el TestClient de FastAPI
]

[project.scripts]
verbasizer = "verbasizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
