[project]
name = "verbasizer"
version = "0.1.0"
description = "Herramienta de cut-up: reconstrucción del Verbasizer de Bowie y de los métodos de Burroughs y Gysin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["cut-up", "burroughs", "gysin", "bowie", "verbasizer", "escritura generativa"]

# El motor no tiene dependencias a propósito: es Python puro y determinístico.
dependencies = []

[project.optional-dependencies]
# Etiquetado gramatical. Los modelos de idioma se instalan aparte porque no
# están en PyPI:
#   python -m spacy download es_core_news_sm
#   python -m spacy download en_core_web_sm
nlp = [
    "spacy>=3.7,<4",
]

# Ventana de escritorio. pywebview trae solo lo que corresponde a cada sistema:
# pyobjc en macOS, pythonnet en Windows (verificado en sus metadatos, v6.2.1).
desktop = [
    "spacy>=3.7,<4",
    "pywebview>=6,<7",
]

# Empaquetado como aplicación.
build = [
    "pyinstaller>=6.10",
]

dev = [
    "pytest>=8",
]

[project.scripts]
verbasizer = "verbasizer.cli:main"
verbasizer-app = "verbasizer.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
